# Agent preset anima-viewing: one short session per close view of a video
# (DESIGN §11). The adapter selects a vision-capable model and delivers the
# frames as image blocks; her only tool is viewing_note, a root Anima
# behavior scoped to this session kind. Only the note goes back to Self.
- insert:
    - id: anima-preset-viewing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anima-viewing
        name: Anima viewing
        description: A close look at a video she chose. Frames in, one note out.
        order: 25
        plugins:
          - id: persona
            name: '@anima/core/persona'
            config:
              kind: viewing
