# Agent preset anima-viewing: a close look at a video she chose, run as a
# subagent of her waking session (docs/dsh.md). The adapter picks a
# vision-capable model and sends the frames as image blocks; the subagent has
# no Anima behaviors, and its final answer is her viewing note, the only thing
# that goes back to her waking session.
- insert:
    - id: anima-preset-viewing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anima-viewing
        name: Anima viewing
        description: A close look at a video she chose. Frames in, one note out.
        order: 25
        plugins:
          - id: persona
            name: '@anima/core/persona'
            config:
              kind: viewing
