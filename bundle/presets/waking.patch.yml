# Agent preset anima-waking: one session per period of her wakefulness
# (docs/design/life.md). Anima creates these sessions itself, prepared when she
# falls asleep; the persona row makes her persona card the complete system
# prompt. Tools come from root Anima behaviors, scoped to her waking sessions by
# their metadata. No dsh-time-context: it reads the real clock, and every Anima
# arrival already starts with the time on her own (possibly sped-up) clock.
# Compaction is working memory fading over a long waking.
- insert:
    - id: anima-preset-waking
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anima-waking
        name: Anima waking
        description: One period of her wakefulness. Every chat, her heartbeat and her alarms arrive here.
        order: 20
        plugins:
          - id: persona
            name: '@anima/core/persona'
            config:
              kind: waking
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
