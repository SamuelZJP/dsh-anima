# Agent preset anima-consolidation: part of her sleep. When she falls asleep,
# what she perceived is sorted into memories here (docs/design/memory.md), one
# session per ended waking. Anima selects the consolidation model before each turn.
# Its tools are memory_write and self_note, root Anima behaviors scoped to this
# session kind.
- insert:
    - id: anima-preset-consolidation
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anima-consolidation
        name: Anima memory
        description: Consolidation in her sleep. Sorts what she perceived into lasting memories.
        order: 23
        plugins:
          - id: persona
            name: '@anima/core/persona'
            config:
              kind: consolidation
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
