# Agent preset anima-group-triage: the cheap group-chat decision (DESIGN §5).
# One session per her day; Anima selects the group-triage model before each
# batch. Tools are the root Anima behaviors scoped to group-triage:
# group_wake and group_pass. (Keep compaction-basic's defaults; see triage.)
- insert:
    - id: anima-preset-group-triage
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anima-group-triage
        name: Anima group triage
        description: Sorts buffered group chatter into ignore, remember, or wake.
        order: 24
        plugins:
          - id: persona
            name: '@anima/core/persona'
            config:
              kind: group-triage
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
