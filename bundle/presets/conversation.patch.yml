# Agent preset anima-conversation. Anima creates these sessions itself; the persona
# row makes her constitution the complete system prompt. Tools come from root
# Anima behaviors, scoped per session by their metadata (DESIGN §6).
- insert:
    - id: anima-preset-conversation
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: anima-conversation
        name: Anima conversation
        description: One chat channel with her. Speech only through the platform say tool.
        order: 20
        plugins:
          - id: persona
            name: '@anima/core/persona'
            config:
              kind: conversation
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
