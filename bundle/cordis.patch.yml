# The Anima plugin: the persona itself (docs/CONSTITUTION.md). Only persona rows
# live here; anima-guard and anima-page are outside her and ship in guard-bundle.
# Root-level rows register into DSH's global layer; Anima behaviors hide
# themselves outside Anima sessions (tool `when` conditions).
- insert:
    - id: anima-core
      name: '@anima/core'
    - id: anima-life
      name: '@anima/life'
    - id: anima-memory
      name: '@anima/memory'
    # QQ through a backend (OneBot v11: NotRainMeow or any OneBot v11 runtime). Disabled here
    # because it needs backend.url, account and owner; a profile patch or --patch
    # overlay enables it with that config (docs/design/channels.md).
    - id: anima-adapter-qq
      name: '@anima/adapter-qq'
      disabled: true
    # Bilibili, read-only browsing on her own account (docs/design/channels.md). Disabled
    # here so a profile never browses before the owner chose to; a patch sets
    # disabled: false (config is optional; log in with /anima bili login).
    - id: anima-adapter-bili
      name: '@anima/adapter-bili'
      disabled: true
