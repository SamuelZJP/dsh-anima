# Anima bundle layer. Root-level rows register into DSH's global layer; Anima
# behaviors hide themselves outside Anima sessions (tool `when` conditions).
- insert:
    - id: anima-core
      name: '@anima/core'
    - id: anima-life
      name: '@anima/life'
    - id: anima-memory
      name: '@anima/memory'
    - id: anima-adapter-local
      name: '@anima/adapter-local'
