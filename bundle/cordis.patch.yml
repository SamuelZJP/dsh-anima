# Anima bundle layer. Root-level rows register into DSH's global layer; Anima
# behaviors hide themselves outside Anima sessions (tool `when` conditions).
- insert:
    - id: anima-core
      name: '@anima/core'
    - id: anima-life
      name: '@anima/life'
    - id: anima-memory
      name: '@anima/memory'
    - id: anima-adapter-local
      name: '@anima/adapter-local'
    # QQ over OneBot v11 (NapCatQQ or any OneBot v11 runtime). Disabled here
    # because it needs url, account and owner; a profile patch or --patch
    # overlay enables it with that config (docs/DSH-INTEGRATION.md).
    - id: anima-adapter-qq
      name: '@anima/adapter-qq'
      disabled: true
    # Bilibili, read-only browsing on her own account (DESIGN §11). Disabled
    # here so a profile never browses before the owner chose to; a patch sets
    # disabled: false (config is optional; log in with /anima bili login).
    - id: anima-adapter-bili
      name: '@anima/adapter-bili'
      disabled: true
    # The Anima page in DSH's web UI (sidebar entry, tabs); owner routes under
    # /api/anima (DESIGN §12, DSH-INTEGRATION §8e).
    - id: anima-page
      name: '@anima/page'
